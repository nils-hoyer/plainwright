name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # the Release workflow runs CI before it releases
  workflow_call:

jobs:
  verify:
    name: Verify (Node LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # format, types, generated docs, feature lint, unit and end-to-end tests
      - run: npm run verify
      - name: Run the starter example with the packed package
        run: |
          npm pack
          cd examples/starter
          npm install --no-save ../../plainwright-*.tgz
          npx playwright install chromium
          npm run lint
          npm test
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            examples/starter/playwright-report/
          retention-days: 7
