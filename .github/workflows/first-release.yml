name: First release

# Run once from the Actions tab on main. Publishes 0.3.0, the first version of
# @codesurfer/plainwright, with the token in the secret NPM_TOKEN: npm offers trusted publishing
# only for a package that exists. Then it creates the GitHub release, installs the package from
# npm into a new project and moves the starter to ^0.3.0.
#
# Afterwards: set up the trusted publisher for the package on npmjs.com, delete the token and
# NPM_TOKEN, and delete this workflow. Later releases use the Release workflow.
#
# If a job after "version" fails, use "Re-run failed jobs": a new run stops because v0.3.0 exists.
on:
  workflow_dispatch:

concurrency: release

permissions: {}

env:
  VERSION: 0.3.0

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Check that the version and the tag are new
        run: |
          name=$(node -p "require('./package.json').name")
          if [ "$name" != "@codesurfer/plainwright" ]; then
            echo "::error::package.json names $name. Merge the rename first."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "::error::The tag v$VERSION exists."
            exit 1
          fi
          if npm view "$name@$VERSION" version 2>/dev/null | grep -q .; then
            echo "::error::$name@$VERSION is on npm."
            exit 1
          fi
      - name: Set the version, commit and tag
        id: version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version "$VERSION" --no-git-tag-version
          git commit --all --message "Release $VERSION"
          git tag "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      # --atomic pushes both or neither. This fails before anything is published
      # if main moved on since the run started or doesn't accept pushes from Actions.
      - name: Push commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/$TAG"

  publish:
    needs: version
    runs-on: ubuntu-latest
    # Only main may deploy to it. NPM_TOKEN may be a secret of this environment or of the
    # repository; the environment's wins.
    environment: npm
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepack builds dist/. The token must be a granular access token with read and write
      # access to the @codesurfer scope that may bypass two-factor authentication.
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      # The highlights come first, then the pull requests since v0.2.0, grouped by
      # .github/release.yml.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file ".github/release-notes/$TAG.md" \
            --generate-notes \
            --verify-tag

  check:
    name: Set up a new project from npm and run its first test
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Wait until npm serves the new version as latest
        run: |
          for attempt in $(seq 20); do
            latest=$(npm view @codesurfer/plainwright dist-tags.latest 2>/dev/null || true)
            [ "$latest" = "$VERSION" ] && exit 0
            sleep 15
          done
          echo "::error::npm shows latest=$latest, not $VERSION."
          exit 1
      - name: Set up a new project with init and run its first test
        run: |
          PORT=3125 node test/server.mjs &
          mkdir "$RUNNER_TEMP/new-project" && cd "$RUNNER_TEMP/new-project"
          npx --yes "@codesurfer/plainwright@$VERSION" init --yes --url http://localhost:3125 --ai agents
          grep -F "from '@codesurfer/plainwright/config'" playwright.config.ts
          npm run lint
          npm test

  starter:
    name: Move the starter to ^0.3.0
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # For 0.x, ^0.2.0 does not take 0.3.0. The starter has no lock file.
      - name: Commit and push
        run: |
          cd examples/starter
          npm pkg set "devDependencies.@codesurfer/plainwright=^$VERSION"
          npm install --no-save --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --message "Starter uses $VERSION from npm"
          git push origin HEAD:main
