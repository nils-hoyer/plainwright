<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Plainwright</title>
  <desc id="desc">Browser tests as plain English sentences, built on Playwright.</desc>
  <!-- Source of the GitHub social preview. Export with npm run images and upload social-preview.png
       in the repository settings: Settings → General → Social preview. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f24"/>
      <stop offset="1" stop-color="#22313b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <image href="logo.svg" x="85" y="170" width="308" height="308"/>
  <g font-family="Inter, sans-serif">
    <text x="440" y="240" font-size="104" font-weight="700" fill="#ffffff" letter-spacing="-1.5"><tspan fill="#4cc552">Plain</tspan>wright</text>
    <text x="444" y="300" font-size="36" fill="#c9d1d9">Browser tests as plain English sentences</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="26" fill="#c9d1d9">
    <rect x="440" y="350" width="760" height="150" rx="14" fill="#000" fill-opacity="0.25"/>
    <text x="470" y="395">* I open the url <tspan fill="#7ee787">"/login"</tspan></text>
    <text x="470" y="435">* I click the <tspan fill="#7ee787">"Log in"</tspan> button</text>
    <text x="470" y="475">* I see the text <tspan fill="#7ee787">"Welcome back!"</tspan></text>
  </g>
</svg>
