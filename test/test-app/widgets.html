<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widgets</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Elements with roles beyond the obvious ones, as component libraries render them. -->
    <main>
      <h1>Widgets</h1>

      <svg role="img" aria-label="Company logo" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18" fill="#2b6cb0" />
      </svg>

      <div role="menu" aria-label="View">
        <div role="menuitem" tabindex="-1">Refresh</div>
        <div role="menuitemcheckbox" aria-checked="true" tabindex="-1">Show grid</div>
        <div role="menuitemradio" aria-checked="false" tabindex="-1">Compact</div>
      </div>

      <div role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
        <h2 id="confirm-title">Delete order?</h2>
        <p id="confirm-text">This cannot be undone.</p>
        <button type="button">Keep</button>
      </div>

      <!-- A name with a part that changes: the alias in test/pages/widgets.json finds it. -->
      <button type="button">Cart (3)</button>

      <!-- Switches: a button with role switch, and a checkbox shown as one. -->
      <button type="button" role="switch" aria-checked="false" id="dark-mode">Dark mode</button>
      <label><input type="checkbox" role="switch" checked /> Notifications</label>
      <script>
        document.getElementById('dark-mode').addEventListener('click', (event) => {
          const on = event.currentTarget.getAttribute('aria-checked') !== 'true';
          event.currentTarget.setAttribute('aria-checked', String(on));
        });
      </script>

      <!-- A custom dropdown: a field with suggestions, shown at the end of the page (a portal). -->
      <label for="country">Country</label>
      <input
        id="country"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="countries"
        autocomplete="off"
      />
    </main>
    <ul id="countries" role="listbox" aria-label="Countries" hidden></ul>
    <script>
      const field = document.getElementById('country');
      const list = document.getElementById('countries');
      field.addEventListener('input', () => {
        const matches = ['Germany', 'Georgia', 'Greece'].filter((name) =>
          name.toLowerCase().startsWith(field.value.toLowerCase()),
        );
        list.replaceChildren(
          ...matches.map((name) => {
            const option = document.createElement('li');
            option.setAttribute('role', 'option');
            option.textContent = name;
            option.addEventListener('click', () => {
              field.value = name;
              list.hidden = true;
              field.setAttribute('aria-expanded', 'false');
            });
            return option;
          }),
        );
        list.hidden = !field.value || !matches.length;
        field.setAttribute('aria-expanded', String(!list.hidden));
      });
    </script>
  </body>
</html>
