<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Order</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <!-- Served at /orders/<number>: shows the order with that number from /api/orders. -->
      <p id="created" role="status" hidden></p>
      <h1 id="title">Order</h1>
      <p>Item: <span id="item"></span></p>
    </main>
    <script>
      const id = location.pathname.split('/').pop();
      if (sessionStorage.getItem('created') === id) {
        sessionStorage.removeItem('created');
        // A moment later, longer than a second, so the step that takes the number has to wait.
        setTimeout(() => {
          const created = document.getElementById('created');
          created.textContent = `Order #${id} was created.`;
          created.hidden = false;
        }, 1200);
      }
      fetch(`/api/orders/${id}`)
        .then((response) => response.json())
        .then((order) => {
          document.getElementById('title').textContent = `Order ${order.id}`;
          document.getElementById('item').textContent = order.item;
        });
    </script>
  </body>
</html>
