<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="login.html" data-testid="link-logout">Logout</a>
        <a href="forms.html" data-testid="link-forms">Forms Demo</a>
        <a href="interactions.html" data-testid="link-interactions">Interactions Demo</a>
      </nav>
      <p id="signed-in"></p>
    </header>

    <main>
      <h1 data-testid="heading-welcome">Welcome to your Dashboard</h1>

      <section data-testid="section-overview" aria-labelledby="overview-title">
        <h2 id="overview-title">Account Overview</h2>
        <ul aria-label="Accounts">
          <li class="account-item" data-testid="item-savings">Savings: $1,234.56</li>
          <li class="account-item" data-testid="item-checking">Checking: $987.32</li>
          <li class="account-item" data-testid="item-investments">Investments: $45,678.90</li>
        </ul>
      </section>

      <section data-testid="section-actions" aria-labelledby="actions-title">
        <h2 id="actions-title">Quick Actions</h2>
        <button data-testid="btn-transfer">Transfer Money</button>
        <button data-testid="btn-statement">Download Statement</button>
        <button data-testid="btn-disabled" disabled>Coming Soon</button>
      </section>
    </main>
    <script>
      const user = localStorage.getItem('user');
      document.getElementById('signed-in').textContent = user
        ? 'Signed in as ' + user
        : 'Not signed in';
    </script>
  </body>
</html>
