<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mouse Events Demo</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      #mouse-target {
        width: 400px;
        height: 250px;
        background: #e8ecf0;
        border: 2px solid #b0b8c2;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 40px auto;
        font-size: 1.1rem;
        color: #555;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mouse Events Demo</h1>

      <div id="mouse-target" data-testid="mouse-target">Mouse Target Area</div>

      <!-- Updated by the drawing step in test/steps/drawing.steps.ts -->
      <section aria-label="Last mouse down">
        <p id="last-mousedown" data-testid="last-mousedown">-</p>
      </section>
      <section aria-label="Last mouse up">
        <p id="last-mouseup" data-testid="last-mouseup">-</p>
      </section>
    </main>

    <script>
      const lastMousedown = document.getElementById('last-mousedown');
      const lastMouseup = document.getElementById('last-mouseup');

      document.addEventListener('mousedown', (e) => {
        lastMousedown.textContent = 'mousedown:' + e.button;
      });

      document.addEventListener('mouseup', (e) => {
        lastMouseup.textContent = 'mouseup:' + e.button;
      });
    </script>
  </body>
</html>
