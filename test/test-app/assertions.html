<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assertions Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Assertions Demo</h1>

      <!-- Text content (exact and partial text, empty element) -->
      <section aria-label="Greeting">
        <p data-testid="text-exact" class="content active">Hello World</p>
      </section>
      <section aria-label="Notes">
        <p data-testid="text-partial">This contains some text.</p>
      </section>
      <section aria-label="Empty box" data-testid="div-empty"></section>

      <!-- Open and closed: a button that shows what it controls, and a details element. -->
      <section aria-label="Delivery">
        <button type="button" aria-expanded="false" aria-controls="shipping">Shipping</button>
        <p id="shipping" hidden>Ships in 2 days.</p>
        <details>
          <summary>Returns</summary>
          <p>Free returns within 30 days.</p>
        </details>
      </section>
      <script>
        document.querySelector('[aria-controls="shipping"]').addEventListener('click', (event) => {
          const open = event.currentTarget.getAttribute('aria-expanded') !== 'true';
          event.currentTarget.setAttribute('aria-expanded', String(open));
          document.getElementById('shipping').hidden = !open;
        });
      </script>

      <!-- Counting list items -->
      <ul aria-label="Fruits">
        <li class="list-item">Apple</li>
        <li class="list-item">Banana</li>
        <li class="list-item">Cherry</li>
      </ul>

      <!-- Accessible description -->
      <span id="hint-text">This is a hint for the input below.</span>
      <input
        data-testid="input-aria-described"
        type="text"
        aria-label="Name input"
        aria-describedby="hint-text"
      />

      <!-- Accessible error message -->
      <span id="error-msg">This field is required.</span>
      <input
        data-testid="input-aria-error"
        type="text"
        aria-label="Required field"
        aria-invalid="true"
        aria-errormessage="error-msg"
      />

      <!-- Multi-select -->
      <label for="colors">Colors</label>
      <select id="colors" data-testid="select-multi" multiple size="3">
        <option value="red">Red</option>
        <option value="green" selected>Green</option>
        <option value="blue" selected>Blue</option>
      </select>

      <!-- Viewport: visible immediately -->
      <p data-testid="in-viewport">I am in the viewport</p>

      <!-- Spacer to push the next element below the viewport -->
      <div style="height: 3000px"></div>

      <p data-testid="below-viewport">Way below the viewport</p>
    </main>
  </body>
</html>
